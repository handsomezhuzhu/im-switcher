name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 只做静态检查：语法、metadata、翻译、shell 脚本、能不能打出 EGO zip。
# 单元测试（./tests/run.sh）和真机加载测试（./scripts/ci-shell-test.sh）都不放 CI：
#   - 单元测试本地一条命令就跑，2 秒出结果，没必要占 CI 时间
#   - 真机加载测试需要真的把 mutter compositor 跑起来。GitHub 的容器没有 GPU、
#     没有 seat、也没有 logind，gnome-shell --headless 建完软件渲染器就静默退出
#     （退出码 0，连错误都不打），是环境限制，不是代码问题。
#     那个测试在真机上是好的，见 README「测试」一节。
# 哪天想加回来，把下面的注释连同对应的 job 一起取消注释即可。

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具
        run: dnf -y install gjs nodejs gettext python3 zip

      - name: JS 语法（按 ESM 模块检查）
        run: |
          set -e
          for f in extension.js lib/*.js tests/*.js; do
            cp "$f" /tmp/chk.mjs
            node --check /tmp/chk.mjs
            echo "ok   $f"
          done

      - name: metadata.json 合法且字段齐全
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('metadata.json'))
          for key in ('uuid', 'name', 'description', 'shell-version', 'url'):
              assert key in d, f'缺少字段 {key}'
          # version 字段 EGO 已废弃（内部使用），我们不该填
          assert 'version' not in d, 'version 字段已废弃，删掉'
          assert '@' in d['uuid'], 'UUID 必须是 xxx@yyy 形式'
          assert d['gettext-domain'] == 'im-switcher', 'gettext-domain 要和生产 .mo 的文件名一致'
          assert '51' in d['shell-version'], 'shell-version 至少要覆盖当前 GNOME'
          print('metadata.json OK:', d['uuid'], d['shell-version'])
          PY

      - name: 翻译文件能编译
        run: |
          set -e
          for po in po/*.po; do
            [ -e "$po" ] || { echo "没有 .po，跳过"; continue; }
            msgfmt --check -o /dev/null "$po"
            echo "ok   $po"
          done

      - name: shell 脚本语法
        run: |
          set -e
          for s in scripts/*.sh tests/run.sh; do
            bash -n "$s"
            echo "ok   $s"
          done

      - name: 能打出 EGO 上传用的 zip
        run: |
          bash scripts/build-zip.sh
          unzip -l im-switcher.zip | grep -q metadata.json

  # ---- 想跑单元测试的话取消下面注释 ----
