name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 关于那个"无头 GNOME Shell 真加载"测试为什么不在这个 workflow 里：
# 它需要真的把 mutter compositor 跑起来。GitHub 的容器没有 GPU、没有 seat、
# 也没有 logind，gnome-shell --headless 建完软件渲染器就静默退出（退出码 0，
# 连错误都不打），是环境限制，不是代码问题。
# 那个测试在真机上是好的，见 README「测试」一节和 scripts/ci-shell-test.sh
# （已在 Fedora 45 / GNOME 51.1 和 Ubuntu 24.04 / GNOME 46 上验证过，
#  并且抓出过两个真 bug）。要跑就在盒子或虚拟机上跑，一条命令。

jobs:
  # 不需要图形环境，几秒钟跑完
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: 装工具
        run: dnf -y install gjs nodejs gettext python3 zip

      - name: JS 语法（按 ESM 模块检查）
        run: |
          set -e
          for f in extension.js lib/*.js tests/*.js; do
            cp "$f" /tmp/chk.mjs
            node --check /tmp/chk.mjs
            echo "ok   $f"
          done

      - name: metadata.json 合法且字段齐全
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('metadata.json'))
          for key in ('uuid', 'name', 'description', 'shell-version', 'url', 'version'):
              assert key in d, f'缺少字段 {key}'
          assert '@' in d['uuid'], 'UUID 必须是 xxx@yyy 形式'
          assert d['gettext-domain'] == 'im-switcher', 'gettext-domain 要和生产 .mo 的文件名一致'
          assert '51' in d['shell-version'], 'shell-version 至少要覆盖当前 GNOME'
          print('metadata.json OK:', d['uuid'], d['shell-version'])
          PY

      - name: 翻译文件能编译
        run: |
          set -e
          for po in po/*.po; do
            [ -e "$po" ] || { echo "没有 .po，跳过"; continue; }
            msgfmt --check -o /dev/null "$po"
            echo "ok   $po"
          done

      - name: shell 脚本语法
        run: |
          set -e
          for s in scripts/*.sh tests/run.sh; do
            bash -n "$s"
            echo "ok   $s"
          done

      - name: 能打出 EGO 上传用的 zip
        run: |
          bash scripts/build-zip.sh
          unzip -l im-switcher.zip | grep -q metadata.json

  # 纯逻辑：框架状态读写、Hidden 覆盖、反复切换
  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: 装 gjs
        run: dnf -y install gjs
      - name: 跑测试
        run: bash tests/run.sh
